<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ room }} - {{ location }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header class="topbar compact"><div class="container topbar-inner"><div><p class="eyebrow">STORAGE CONTENTS</p><h1>{{ room }} · {{ location }}</h1><p class="subtitle">该位置存放的全部物品</p></div><a class="button secondary" href="{{ url_for('locations') }}">返回二维码页</a></div></header>
<main class="container narrow"><section class="panel">
{% for item in items %}<div class="reminder-row"><div><strong>{{ item.name }}</strong><small>{{ item.item_code }} · {{ item.category }}</small></div><span>数量 {{ item.quantity }}</span></div>{% else %}<p class="muted">该位置暂无物品。</p>{% endfor %}
</section></main>
</body>
</html>
