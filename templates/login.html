<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录｜家庭物品收纳管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-visual">
        <p class="eyebrow brown">WARM HOME ORGANIZER</p>
        <h1>把家里的每一件物品<br>都放在清楚的位置</h1>
        <p>分类、编号、提醒、购物清单与收纳二维码，让家庭整理更轻松。</p>
        <div class="home-scene">
            <div class="shelf">
                <div class="box">衣物</div>
                <div class="box">书籍</div>
                <div class="box">药品</div>
            </div>
            <div class="plant">🪴</div>
        </div>
    </section>

    <section class="auth-card">
        <div class="auth-heading">
            <p class="eyebrow brown">WELCOME BACK</p>
            <h2>登录系统</h2>
            <p>可使用手机号或邮箱登录</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post" class="auth-form">
            <label>
                <span>手机号或邮箱</span>
                <input name="account" required autocomplete="username" placeholder="请输入手机号或邮箱">
            </label>
            <label>
                <span>密码</span>
                <input type="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
            </label>
            <button class="button primary auth-submit" type="submit">登录</button>
        </form>

        <p class="auth-switch">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
    </section>
</main>
</body>
</html>
