<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}｜家庭物品收纳管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar compact">
    <div class="container topbar-inner">
        <div>
            <p class="eyebrow">ITEM FORM</p>
            <h1>{{ title }}</h1>
            <p class="subtitle">带 * 的项目为必填项</p>
        </div>
        <a class="button secondary" href="{{ url_for('index') }}">返回首页</a>
    </div>
</header>

<main class="container narrow">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <section class="panel form-panel">
        <form method="post" class="item-form">
            <div class="form-grid">
                <label>
                    <span>物品编号 *</span>
                    <input name="item_code" required value="{{ item.get('item_code', '') }}" placeholder="例如 MED-001">
                </label>

                <label>
                    <span>物品名称 *</span>
                    <input name="name" required value="{{ item.get('name', '') }}" placeholder="例如 感冒药">
                </label>

                <label>
                    <span>物品类别 *</span>
                    <select name="category" required>
                        {% for category in categories %}
                        <option value="{{ category }}" {% if item.get('category', '其他') == category %}selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label>
                    <span>物品状态 *</span>
                    <select name="status" required>
                        {% for status in statuses %}
                        <option value="{{ status }}" {% if item.get('status', '正常使用') == status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label>
                    <span>存放房间 *</span>
                    <input name="room" required value="{{ item.get('room', '') }}" placeholder="例如 客厅">
                </label>

                <label>
                    <span>具体位置 *</span>
                    <input name="location" required value="{{ item.get('location', '') }}" placeholder="例如 电视柜第二层">
                </label>

                <label>
                    <span>数量 *</span>
                    <input type="number" name="quantity" min="0" required value="{{ item.get('quantity', 1) }}">
                </label>

                <label>
                    <span>购入日期</span>
                    <input type="date" name="purchase_date" value="{{ item.get('purchase_date', '') or '' }}">
                </label>

                <label>
                    <span>有效期</span>
                    <input type="date" name="expiry_date" value="{{ item.get('expiry_date', '') or '' }}">
                </label>

                <label class="full-width">
                    <span>备注</span>
                    <textarea name="notes" rows="4" placeholder="记录品牌、用途或其他说明">{{ item.get('notes', '') or '' }}</textarea>
                </label>
            </div>

            <div class="form-actions">
                <button class="button primary" type="submit">保存</button>
                <a class="button secondary" href="{{ url_for('index') }}">取消</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
