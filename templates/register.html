<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册｜家庭物品收纳管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-visual">
        <p class="eyebrow brown">CREATE YOUR HOME</p>
        <h1>建立属于你的<br>家庭收纳档案</h1>
        <p>注册后，每位用户只能查看和管理自己的家庭物品数据。</p>
        <div class="home-scene">
            <div class="shelf">
                <div class="box">厨房</div>
                <div class="box">卧室</div>
                <div class="box">客厅</div>
            </div>
            <div class="plant">🏠</div>
        </div>
    </section>

    <section class="auth-card">
        <div class="auth-heading">
            <p class="eyebrow brown">NEW ACCOUNT</p>
            <h2>注册账号</h2>
            <p>手机号和邮箱均为必填项</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post" class="auth-form">
            <label>
                <span>昵称</span>
                <input name="display_name" required autocomplete="name" placeholder="例如：小凡的家">
            </label>
            <label>
                <span>手机号</span>
                <input name="phone" required inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入11位手机号">
            </label>
            <label>
                <span>邮箱</span>
                <input type="email" name="email" required autocomplete="email" placeholder="请输入邮箱地址">
            </label>
            <label>
                <span>密码</span>
                <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="至少6位">
            </label>
            <label>
                <span>确认密码</span>
                <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password" placeholder="再次输入密码">
            </label>
            <button class="button primary auth-submit" type="submit">注册并进入系统</button>
        </form>

        <p class="auth-switch">已经有账号？<a href="{{ url_for('login') }}">返回登录</a></p>
    </section>
</main>
</body>
</html>
